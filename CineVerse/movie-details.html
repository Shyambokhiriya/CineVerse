<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineVerse - Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="fas fa-play-circle"></i> CineVerse</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="browse.html">Browse</a></li>
                    <li class="nav-item"><a class="nav-link" href="watchlist.html">My Watchlist</a></li>
                </ul>
                <ul class="navbar-nav" id="auth-link">
                    <li class="nav-item"><a class="btn btn-primary" href="auth.html">Login / Register</a></li>
                </ul>
            </div>
        </div>
    </nav>

    
    <div id="movie-banner" class="hero-banner" style="height: 55vh;">
        <div class="hero-overlay"></div>
    </div>
    <div class="container" id="details-container" style="margin-top: -150px; position: relative; z-index: 5; min-height: 60vh;">
        <div class="row">
            <div class="col-md-3 text-center mb-4">
                <img id="movie-poster" src="" class="img-fluid rounded shadow-lg mb-3 border border-dark" alt="Poster">
                <button id="add-watchlist-btn" class="btn btn-outline-light w-100 mb-2"><i class="fas fa-plus"></i> Add to Watchlist</button>
            </div>
            <div class="col-md-9 text-light mt-md-5 pt-md-4">
                <h1 id="movie-title" class="fw-bold display-4">Loading...</h1>
                <div class="text-muted mb-4 fs-5" id="movie-meta"></div>
                <p class="lead mb-4" id="movie-desc"></p>
                <div class="mb-4 text-muted">
                    <strong class="text-light">Director:</strong> <span id="movie-director"></span><br>
                    <strong class="text-light">Cast:</strong> <span id="movie-cast"></span>
                </div>
                <button class="btn btn-primary btn-lg px-4 rounded-pill" onclick="document.getElementById('trailer-section').scrollIntoView({behavior: 'smooth'})"><i class="fas fa-play me-2"></i> Watch Trailer</button>
            </div>
        </div>
        <div id="trailer-section" class="mt-5 pt-5 text-center">
            <h3 class="mb-4">Official Trailer</h3>
            <div class="ratio ratio-16x9 w-100 w-lg-75 mx-auto rounded shadow-lg overflow-hidden border border-dark">
                <iframe id="movie-trailer" src="" allowfullscreen></iframe>
            </div>
        </div>
    </div>


    <footer class="footer text-center py-4 mt-5">
        <div class="container">
            <p>&copy; 2026 CineVerse. All rights reserved.</p>
            <div class="social-icons">
                <a href="#" class="text-muted me-3"><i class="fab fa-facebook fa-lg"></i></a>
                <a href="#" class="text-muted me-3"><i class="fab fa-twitter fa-lg"></i></a>
                <a href="#" class="text-muted"><i class="fab fa-instagram fa-lg"></i></a>
            </div>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
