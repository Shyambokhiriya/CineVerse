<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineVerse - Browse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="fas fa-play-circle"></i> CineVerse</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="browse.html">Browse</a></li>
                    <li class="nav-item"><a class="nav-link" href="watchlist.html">My Watchlist</a></li>
                </ul>
                <ul class="navbar-nav" id="auth-link">
                    <li class="nav-item"><a class="btn btn-primary" href="auth.html">Login / Register</a></li>
                </ul>
            </div>
        </div>
    </nav>

    
    <div class="container pt-5 mt-5" style="min-height: 70vh;">
        <h2 class="mb-4">Browse Titles</h2>
        <div class="row mb-4 g-3">
            <div class="col-md-4">
                <input type="text" id="search-input" class="form-control" placeholder="Search by title...">
            </div>
            <div class="col-md-2">
                <select id="filter-genre" class="form-select"><option value="">All Genres</option></select>
            </div>
            <div class="col-md-2">
                <select id="filter-type" class="form-select">
                    <option value="">All Types</option><option value="Movie">Movies</option><option value="Web Series">Web Series</option>
                </select>
            </div>
            <div class="col-md-2">
                <select id="sort-by" class="form-select">
                    <option value="latest">Latest</option><option value="rating">Top Rated</option>
                </select>
            </div>
        </div>
        <div class="row" id="browse-grid"></div>
    </div>


    <footer class="footer text-center py-4 mt-5">
        <div class="container">
            <p>&copy; 2026 CineVerse. All rights reserved.</p>
            <div class="social-icons">
                <a href="#" class="text-muted me-3"><i class="fab fa-facebook fa-lg"></i></a>
                <a href="#" class="text-muted me-3"><i class="fab fa-twitter fa-lg"></i></a>
                <a href="#" class="text-muted"><i class="fab fa-instagram fa-lg"></i></a>
            </div>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
