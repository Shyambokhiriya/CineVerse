<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Movie Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <link href="../css/admin.css" rel="stylesheet">
</head>
<body>
    <div class="sidebar d-flex flex-column" id="sidebar">
        <h4 class="text-center text-primary fw-bold my-3"><i class="fas fa-play-circle"></i> CineVerse</h4>
        <div class="text-center text-muted small mb-4">Logged in as: <span id="admin-name"></span></div>
        <a href="dashboard.html" class=""><i class="fas fa-home fa-fw"></i> Dashboard</a>
        <a href="movies.html" class="active"><i class="fas fa-film fa-fw"></i> Manage Movies</a>
        <a href="categories.html" class=""><i class="fas fa-list fa-fw"></i> Categories</a>
        <a href="users.html" class=""><i class="fas fa-users fa-fw"></i> Users</a>
        <a href="#" onclick="logoutAdmin()" class="mt-auto text-danger"><i class="fas fa-sign-out-alt fa-fw"></i> Logout</a>
    </div>
    <div class="main-content">
        <button class="btn btn-outline-secondary d-md-none mb-3" onclick="document.getElementById('sidebar').classList.toggle('show')"><i class="fas fa-bars"></i> Menu</button>
        
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 id="form-title">Add New Title</h2>
        <a href="movies.html" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back</a>
    </div>
    <div class="card p-4">
        <form id="movieForm" class="needs-validation" novalidate>
            <input type="hidden" id="movieId">
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label">Title</label>
                    <input type="text" class="form-control" id="movieTitle" required>
                    <div class="invalid-feedback">Required field.</div>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Type</label>
                    <select class="form-select" id="movieType" required>
                        <option value="Movie">Movie</option><option value="Web Series">Web Series</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Genre</label>
                    <select class="form-select" id="movieGenre" required></select>
                </div>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <label class="form-label">Release Year</label>
                    <input type="number" class="form-control" id="movieYear" required min="1900" max="2100">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Duration/Seasons</label>
                    <input type="text" class="form-control" id="movieDuration" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Rating (0-10)</label>
                    <input type="number" step="0.1" class="form-control" id="movieRating" required min="0" max="10">
                </div>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label">Director</label>
                    <input type="text" class="form-control" id="movieDirector" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Cast</label>
                    <input type="text" class="form-control" id="movieCast" required>
                </div>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <label class="form-label">Poster URL</label>
                    <input type="url" class="form-control" id="moviePoster" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Backdrop URL</label>
                    <input type="url" class="form-control" id="movieBackdrop" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Trailer URL</label>
                    <input type="url" class="form-control" id="movieTrailer" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label">Description</label>
                <textarea class="form-control" id="movieDesc" rows="3" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary px-5">Save Title</button>
        </form>
    </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
