<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <link href="../css/admin.css" rel="stylesheet">
</head>
<body>
    <div class="sidebar d-flex flex-column" id="sidebar">
        <h4 class="text-center text-primary fw-bold my-3"><i class="fas fa-play-circle"></i> CineVerse</h4>
        <div class="text-center text-muted small mb-4">Logged in as: <span id="admin-name"></span></div>
        <a href="dashboard.html" class="active"><i class="fas fa-home fa-fw"></i> Dashboard</a>
        <a href="movies.html" class=""><i class="fas fa-film fa-fw"></i> Manage Movies</a>
        <a href="categories.html" class=""><i class="fas fa-list fa-fw"></i> Categories</a>
        <a href="users.html" class=""><i class="fas fa-users fa-fw"></i> Users</a>
        <a href="#" onclick="logoutAdmin()" class="mt-auto text-danger"><i class="fas fa-sign-out-alt fa-fw"></i> Logout</a>
    </div>
    <div class="main-content">
        <button class="btn btn-outline-secondary d-md-none mb-3" onclick="document.getElementById('sidebar').classList.toggle('show')"><i class="fas fa-bars"></i> Menu</button>
        
    <h2 class="mb-4">Dashboard Overview</h2>
    <div class="row g-4 mb-5">
        <div class="col-md-3"><div class="card text-bg-primary p-3 shadow"><h5>Total Movies</h5><h2 id="stat-movies">0</h2></div></div>
        <div class="col-md-3"><div class="card text-bg-success p-3 shadow"><h5>Total Series</h5><h2 id="stat-series">0</h2></div></div>
        <div class="col-md-3"><div class="card text-bg-warning p-3 shadow text-dark"><h5>Total Users</h5><h2 id="stat-users">0</h2></div></div>
        <div class="col-md-3"><div class="card text-bg-info p-3 shadow text-dark"><h5>Categories</h5><h2 id="stat-categories">0</h2></div></div>
    </div>
    <h4 class="mb-3">Recently Added</h4>
    <div class="table-responsive">
        <table class="table table-dark table-striped rounded overflow-hidden">
            <thead><tr><th>Title</th><th>Type</th><th>Year</th><th>Rating</th></tr></thead>
            <tbody id="recent-movies-tbody"></tbody>
        </table>
    </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
