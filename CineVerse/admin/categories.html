<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Categories</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <link href="../css/admin.css" rel="stylesheet">
</head>
<body>
    <div class="sidebar d-flex flex-column" id="sidebar">
        <h4 class="text-center text-primary fw-bold my-3"><i class="fas fa-play-circle"></i> CineVerse</h4>
        <div class="text-center text-muted small mb-4">Logged in as: <span id="admin-name"></span></div>
        <a href="dashboard.html" class=""><i class="fas fa-home fa-fw"></i> Dashboard</a>
        <a href="movies.html" class=""><i class="fas fa-film fa-fw"></i> Manage Movies</a>
        <a href="categories.html" class="active"><i class="fas fa-list fa-fw"></i> Categories</a>
        <a href="users.html" class=""><i class="fas fa-users fa-fw"></i> Users</a>
        <a href="#" onclick="logoutAdmin()" class="mt-auto text-danger"><i class="fas fa-sign-out-alt fa-fw"></i> Logout</a>
    </div>
    <div class="main-content">
        <button class="btn btn-outline-secondary d-md-none mb-3" onclick="document.getElementById('sidebar').classList.toggle('show')"><i class="fas fa-bars"></i> Menu</button>
        
    <h2 class="mb-4">Manage Categories</h2>
    <div class="row">
        <div class="col-md-5 mb-4">
            <div class="card p-3">
                <h5>Add Category</h5>
                <form id="catForm" class="d-flex mt-2">
                    <input type="text" id="catName" class="form-control me-2" placeholder="Genre Name" required>
                    <button type="submit" class="btn btn-primary">Add</button>
                </form>
            </div>
        </div>
        <div class="col-md-7">
            <ul class="list-group" id="categories-list"></ul>
        </div>
    </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
