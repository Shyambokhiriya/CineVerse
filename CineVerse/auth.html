<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineVerse - Authentication</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh; background: linear-gradient(rgba(11,11,15,0.8), rgba(11,11,15,0.9)), url('https://dummyimage.com/1920x1080/15151D/333&text=CineVerse+Background') center/cover;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="text-center mb-4"><a href="index.html" class="text-decoration-none"><h1 class="text-primary fw-bold"><i class="fas fa-play-circle"></i> CineVerse</h1></a></div>
                <div class="card p-4 shadow-lg border-0" style="background-color: rgba(21, 21, 29, 0.95);">
                    <ul class="nav nav-pills nav-justified mb-4" id="authTab" role="tablist">
                        <li class="nav-item" role="presentation"><button class="nav-link active" id="login-tab" data-bs-toggle="pill" data-bs-target="#login" type="button">Login</button></li>
                        <li class="nav-item" role="presentation"><button class="nav-link" id="register-tab" data-bs-toggle="pill" data-bs-target="#register" type="button">Register</button></li>
                    </ul>
                    <div class="tab-content" id="authTabContent">
                        <div class="tab-pane fade show active" id="login">
                            <form id="loginForm" class="needs-validation" novalidate>
                                <div class="mb-3">
                                    <label class="form-label">Email address</label>
                                    <input type="email" class="form-control" id="loginEmail" required>
                                    <div class="invalid-feedback">Please enter a valid email.</div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Password</label>
                                    <input type="password" class="form-control" id="loginPassword" required>
                                    <div class="invalid-feedback">Password is required.</div>
                                </div>
                                <div class="mb-3 form-check">
                                    <input type="checkbox" class="form-check-input" id="rememberMe">
                                    <label class="form-check-label" for="rememberMe">Remember me</label>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Login</button>
                                <div class="mt-3 text-center text-muted small">Admin test: admin@cineverse.com / password123</div>
                            </form>
                        </div>
                        <div class="tab-pane fade" id="register">
                            <form id="registerForm" class="needs-validation" novalidate>
                                <div class="mb-3">
                                    <label class="form-label">Full Name</label>
                                    <input type="text" class="form-control" id="regName" required minlength="3">
                                    <div class="invalid-feedback">Name must be at least 3 characters.</div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Email</label>
                                    <input type="email" class="form-control" id="regEmail" required>
                                    <div class="invalid-feedback">Enter a valid email.</div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Password</label>
                                    <input type="password" class="form-control" id="regPassword" required minlength="8">
                                    <div class="invalid-feedback">Password must be at least 8 characters.</div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Confirm Password</label>
                                    <input type="password" class="form-control" id="regConfirmPassword" required>
                                    <div class="invalid-feedback">Passwords must match.</div>
                                </div>
                                <div class="mb-3 form-check">
                                    <input type="checkbox" class="form-check-input" id="terms" required>
                                    <label class="form-check-label" for="terms">I agree to Terms & Conditions</label>
                                    <div class="invalid-feedback">You must agree before submitting.</div>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Register</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
